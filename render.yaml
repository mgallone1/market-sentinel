services:
  - type: web
    name: market-sentinel-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: echo "Render deprecated"
    startCommand: python -c "import time, http.server; server = http.server.HTTPServer(('0.0.0.0', 8080), http.server.SimpleHTTPRequestHandler); server.serve_forever()"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
